[package]
name = "antisequence"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A high-performance graph execution backend for sequencing-read preprocessing"
license = "MIT"
repository = "https://github.com/COMBINE-lab/ANTISEQUENCE"
homepage = "https://github.com/COMBINE-lab/ANTISEQUENCE"
documentation = "https://docs.rs/antisequence"
readme = "README.md"
include = [
    "/src/**",
    "/examples/**",
    "/example_data/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
]
keywords = ["bioinformatics", "fastq", "sequencing", "preprocessing"]
categories = ["science"]

[package.metadata.docs.rs]
# docs.rs must not combine the mutually exclusive portable and AVX2 backends.
all-features = false
features = ["accelerated-gzip"]

[dependencies]
needletail = "0.5"
bio = { version = "4.0.1", default-features = false }
rustc-hash = "1.1"
hashbrown = "0.17"
flate2 = { version = "1.0", features = ["zlib-rs"], default-features = false }
gzp = { version = "2.0.2", default-features = false, features = ["deflate", "flate2"] }
rapidgzip-core = { version = "0.2.0", optional = true }
regex = "1.8"
thiserror = "2.0"
# 0.8.6 fixes RUSTSEC-2026-0097 while preserving the deterministic 0.8 API
# and Xoshiro stream used by ambiguity-policy regression tests.
rand = { version = "0.8.6", default-features = false }
rand_xoshiro = "0.6"
thread_local = "1.1"
memchr = "2.5"
colored = "2.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
cfg-if = "1.0"
rayon = "1.10"
smallvec = "1.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
# optional global allocators
mimalloc = { version = "0.1", optional = true }
jemallocator = { version = "0.5", optional = true }

[features]
# Portable builds select the baseline SIMD available on every supported host:
# SSE2 on x86_64 and NEON on aarch64. Optimized x86_64 artifacts must disable
# defaults and opt in explicitly with `--features simd-avx2`.
default = ["portable-simd"]
portable-simd = ["dep:block-aligner-portable"]
simd-avx2 = ["dep:block-aligner-avx2"]
accelerated-gzip = ["dep:rapidgzip-core"]
# Enable Microsoft mimalloc as global allocator
mimalloc = ["dep:mimalloc"]
# Enable jemalloc as global allocator
jemalloc = ["dep:jemallocator"]
# Reproduce the pre-optimization seed hash/table backend in benchmark binaries.
seed-baseline = []

[target.'cfg(target_arch = "x86_64")'.dependencies]
block-aligner-portable = { package = "block-aligner", version = "0.5", optional = true, features = ["simd_sse2"] }
block-aligner-avx2 = { package = "block-aligner", version = "0.5", optional = true, features = ["simd_avx2"] }
[target.'cfg(target_arch = "aarch64")'.dependencies]
block-aligner-portable = { package = "block-aligner", version = "0.5", optional = true, features = ["simd_neon"] }

[dev-dependencies]
proptest = "1.7"

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = false
debug-assertions = false
overflow-checks = false
strip = false
